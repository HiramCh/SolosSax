plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'org.jetbrains.kotlin.plugin.compose'
}
def run = (System.getenv('GITHUB_RUN_NUMBER') ?: '1') as int
android {
    namespace 'com.saxsolo.taller'
    compileSdk 34
    defaultConfig {
        applicationId 'com.saxsolo.taller'
        minSdk 24
        targetSdk 34
        versionCode run
        versionName "2.${run}"
    }
    // llave fija: cada versión nueva se instala encima de la anterior
    signingConfigs { debug { storeFile file('debug.keystore'); storePassword 'android'; keyAlias 'androiddebugkey'; keyPassword 'android' } }
    buildFeatures { compose true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
    kotlinOptions { jvmTarget = '17' }
}
dependencies {
    implementation platform('androidx.compose:compose-bom:2024.09.03')
    implementation 'androidx.compose.ui:ui'
    implementation 'androidx.compose.material3:material3'
    implementation 'androidx.compose.material:material-icons-core'
    implementation 'androidx.activity:activity-compose:1.9.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-compose:2.8.6'
    testImplementation 'junit:junit:4.13.2'
}
