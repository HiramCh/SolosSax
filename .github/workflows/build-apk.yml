name: Compilar APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.9' }
      - name: Probar y compilar
        shell: bash
        run: |
          gradle testDebugUnitTest assembleDebug --console=plain 2>&1 | tee build.log
          exit ${PIPESTATUS[0]}
      - run: cp app/build/outputs/apk/debug/app-debug.apk TenorSoloMaster.apk
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: TenorSolo Master v${{ github.run_number }}
          files: TenorSoloMaster.apk
      # si falla, el registro queda público para poder leer el error
      - if: failure()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-log
          prerelease: true
          files: build.log
